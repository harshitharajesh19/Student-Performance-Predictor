<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Student Performance Predictor</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Custom styles -->
  <link rel="stylesheet" href="../css/styles.css" />

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

  <main class="page-bg d-flex align-items-center justify-content-center min-vh-100">
    <div class="auth-card shadow-lg">
      <div class="card-inner p-4">
        <div class="text-center mb-3">
          <h1 class="h4 title">Create an Account</h1>
          <p class="subtitle mb-0">Join and check your performance predictions</p>
        </div>

        <form id="registerForm" novalidate>
          <div class="row gx-3">
            <div class="col-12 mb-2">
              <label class="form-label small fw-semibold">Full Name</label>
              <input type="text" id="name" class="form-control form-control-sm" placeholder="Enter your name" required />
            </div>

            <div class="col-12 mb-2">
              <label class="form-label small fw-semibold">Username</label>
              <input type="text" id="username" class="form-control form-control-sm" placeholder="Choose a username" required />
            </div>

            <div class="col-12 mb-2">
              <label class="form-label small fw-semibold">Email</label>
              <input type="email" id="email" class="form-control form-control-sm" placeholder="Enter your email" required />
            </div>

            <div class="col-md-6 mb-2">
              <label class="form-label small fw-semibold">Password</label>
              <input type="password" id="password" class="form-control form-control-sm" placeholder="Enter password" required />
            </div>

            <div class="col-md-6 mb-2">
              <label class="form-label small fw-semibold">Confirm Password</label>
              <input type="password" id="confirmPassword" class="form-control form-control-sm" placeholder="Confirm password" required />
            </div>

            <div class="col-md-6 mb-2">
              <label class="form-label small fw-semibold">Register as</label>
              <select id="role" class="form-select form-select-sm" required>
                <option value="student" selected>Student</option>
                <option value="admin">Admin</option>
              </select>
            </div>

            <div class="col-md-6 mb-2" id="genderGroup">
              <label class="form-label small fw-semibold">Gender</label>
              <select id="gender" class="form-select form-select-sm">
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </div>

            <div class="col-12 mt-2">
              <button type="submit" class="btn btn-primary w-100 fw-semibold" id="registerBtn">Register</button>
            </div>

            <div class="col-12 text-center mt-3">
              <p class="small mb-0">
                Already have an account?
                <a href="login.html" class="link-primary fw-semibold">Login here</a>
              </p>
            </div>

            <div class="col-12 mt-2">
              <div id="message" class="text-center"></div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your register script -->
  <script src="../js/register.js"></script>
</body>
</html>
