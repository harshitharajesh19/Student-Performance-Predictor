<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Configure Indicators | Admin</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link rel="stylesheet" href="../css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="#">Admin • Configure</a>
      <div class="d-flex align-items-center">
        <a href="admin_dashboard.html" class="btn btn-outline-secondary btn-sm me-2">Back</a>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="mb-3">Configure Prediction Indicators</h5>

        <div id="alertWrapper"></div>

        <form id="indicatorsForm" class="row g-3">
          <!-- Toggle + weight for each indicator -->
          <div class="col-md-6">
            <label class="form-label small">Study hours</label>
            <div class="input-group">
              <div class="input-group-text">
                <input id="active_study_hours" class="form-check-input mt-0" type="checkbox" />
              </div>
              <input type="number" step="0.1" id="weight_study_hours" class="form-control" placeholder="Weight (e.g. 1.0)" />
            </div>
            <div class="form-text">Higher weight → more influence on prediction.</div>
          </div>

          <div class="col-md-6">
            <label class="form-label small">Extracurricular hours</label>
            <div class="input-group">
              <div class="input-group-text">
                <input id="active_extracurricular_hours" class="form-check-input mt-0" type="checkbox" />
              </div>
              <input type="number" step="0.1" id="weight_extracurricular_hours" class="form-control" placeholder="Weight" />
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label small">Sleep hours</label>
            <div class="input-group">
              <div class="input-group-text">
                <input id="active_sleep_hours" class="form-check-input mt-0" type="checkbox" />
              </div>
              <input type="number" step="0.1" id="weight_sleep_hours" class="form-control" placeholder="Weight" />
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label small">Social hours</label>
            <div class="input-group">
              <div class="input-group-text">
                <input id="active_social_hours" class="form-check-input mt-0" type="checkbox" />
              </div>
              <input type="number" step="0.1" id="weight_social_hours" class="form-control" placeholder="Weight" />
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label small">Physical activity hours</label>
            <div class="input-group">
              <div class="input-group-text">
                <input id="active_physical_activity_hours" class="form-check-input mt-0" type="checkbox" />
              </div>
              <input type="number" step="0.1" id="weight_physical_activity_hours" class="form-control" placeholder="Weight" />
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label small">Stress level</label>
            <div class="input-group">
              <div class="input-group-text">
                <input id="active_stress_level" class="form-check-input mt-0" type="checkbox" />
              </div>
              <input type="number" step="0.1" id="weight_stress_level" class="form-control" placeholder="Weight" />
            </div>
          </div>

          <div class="col-12">
            <label class="form-label small">Attendance</label>
            <div class="input-group">
              <div class="input-group-text">
                <input id="active_attendance" class="form-check-input mt-0" type="checkbox" />
              </div>
              <input type="number" step="0.1" id="weight_attendance" class="form-control" placeholder="Weight" />
            </div>
          </div>

          <div class="col-12 text-end">
            <button id="saveIndicatorsBtn" class="btn btn-primary">Save</button>
          </div>
        </form>

      </div>
    </div>
  </main>

  <script src="../js/admin/configure_indicators.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
