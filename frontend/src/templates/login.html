<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login | Student Performance Predictor</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Custom styles (same file used by register) -->
  <link rel="stylesheet" href="../css/styles.css" />
  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <main class="page-bg d-flex align-items-center justify-content-center min-vh-100">
    <div class="auth-card shadow-lg">
      <div class="card-inner p-4">
        <div class="text-center mb-3">
          <h1 class="h4 title">Welcome back</h1>
          <p class="subtitle mb-0">Log in to view your dashboard</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Username</label>
            <input id="username" class="form-control form-control-sm" type="text" placeholder="Enter username" required />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <input id="password" class="form-control form-control-sm" type="password" placeholder="Enter password" required />
          </div>

          <div id="message" class="mb-2"></div>

          <button type="submit" class="btn btn-primary w-100 fw-semibold">Login</button>

          <div class="text-center mt-3 small">
            Don't have an account? <a href="register.html" class="link-primary fw-semibold">Register</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
