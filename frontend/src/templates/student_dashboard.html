<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Dashboard | Student GPA Predictor</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Custom styles (reuse your styles.css) -->
  <link rel="stylesheet" href="../css/styles.css" />

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="#">Student GPA</a>
      <div class="d-flex align-items-center">
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">

      <!-- Profile & summary -->
      <div class="col-lg-4">
        <div class="card p-3 shadow-sm">
          <h6 class="mb-2 text-muted">Profile</h6>
          <div>
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div>
                <h5 id="studentName" class="mb-0">—</h5>
                <small id="studentEmail" class="text-muted">—</small>
              </div>
              <div class="text-end">
                <button id="editProfileBtn" class="btn btn-sm btn-link">Edit</button>
              </div>
            </div>

            <ul class="list-unstyled mb-0">
              <li><small class="text-muted">Roll:</small> <span id="studentRoll">—</span></li>
              <li><small class="text-muted">Attendance:</small> <span id="studentAttendance">—</span></li>
              <li><small class="text-muted">Latest GPA:</small> <span id="studentGpa" class="badge bg-info text-dark">—</span></li>
            </ul>
          </div>
        </div>

        <!-- Edit profile modal (bootstrap) -->
        <div class="modal fade" id="editProfileModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h6 class="modal-title">Edit Profile</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form id="editProfileForm">
                  <div class="mb-2">
                    <label class="form-label small">Name</label>
                    <input id="editName" class="form-control form-control-sm" required />
                  </div>
                  <div class="mb-2">
                    <label class="form-label small">Gender</label>
                    <select id="editGender" class="form-select form-select-sm">
                      <option value="">Select</option>
                      <option value="Male">Male</option>
                      <option value="Female">Female</option>
                    </select>
                  </div>
                  <div class="text-end">
                    <button type="submit" class="btn btn-primary btn-sm">Save</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Predict form & result + Chart -->
      <div class="col-lg-8">
        <div class="card p-3 shadow-sm">
          <h6 class="mb-3">Predict GPA</h6>

          <div id="alertWrapper"></div>

          <form id="predictForm" class="row g-2">
            <div class="col-md-6">
              <label class="form-label small">Study hours / day</label>
              <input type="number" step="0.1" id="study_hours_per_day" class="form-control form-control-sm" required />
            </div>
            <div class="col-md-6">
              <label class="form-label small">Extracurricular hours / day</label>
              <input type="number" step="0.1" id="extracurricular_hours_per_day" class="form-control form-control-sm" required />
            </div>

            <div class="col-md-6">
              <label class="form-label small">Sleep hours / day</label>
              <input type="number" step="0.1" id="sleep_hours_per_day" class="form-control form-control-sm" required />
            </div>

            <div class="col-md-6">
              <label class="form-label small">Social hours / day</label>
              <input type="number" step="0.1" id="social_hours_per_day" class="form-control form-control-sm" required />
            </div>

            <div class="col-md-6">
              <label class="form-label small">Physical activity hours / day</label>
              <input type="number" step="0.1" id="physical_activity_hours_per_day" class="form-control form-control-sm" required />
            </div>

            <div class="col-md-6">
              <label class="form-label small">Stress level</label>
              <select id="stress_level" class="form-select form-select-sm" required>
                <option value="Low">Low</option>
                <option value="Moderate" selected>Moderate</option>
                <option value="High">High</option>
              </select>
            </div>

            <!-- attendance shown read-only -->
            <div class="col-12">
              <label class="form-label small">Current attendance (read-only)</label>
              <input type="text" id="attendanceView" class="form-control form-control-sm" readonly />
            </div>

            <div class="col-12 text-end">
              <button id="predictBtn" type="button" class="btn btn-primary btn-sm">Predict GPA</button>
            </div>
          </form>

          <div class="mt-3">
            <h6 class="mb-1">Latest prediction</h6>
            <div id="latestPrediction" class="fs-5 text-success">—</div>
          </div>

          <!-- Chart area -->
          <div class="mt-4">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h6 class="mb-0">Prediction History</h6>
              <div id="trendSummary" class="text-muted small">—</div>
            </div>
            <canvas id="gpaChart" height="140"></canvas>
          </div>
        </div>
      </div>

    </div>
  </main>
<!-- Chat Widget -->
  <div id="chatWidgetButton">💬</div>

  <div id="chatWidgetBox">
    <div id="chatHeader">
      <span>Academic Assistant</span>
      <button id="chatCloseBtn">×</button>
    </div>

    <div id="chatMessages"></div>

    <div id="chatInputBar">
      <input id="chatInput" type="text" placeholder="Type your question..." />
      <button id="chatSendBtn">Send</button>
    </div>
  </div>

  <!-- Scripts -->
  <link rel="stylesheet" href="../css/chat_widget.css">
  <script src="../js/chatbot/chat_widget.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Dashboard script -->
  <script src="../js/student/dashboard.js"></script>
</body>
</html>
