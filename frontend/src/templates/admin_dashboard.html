<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard | Student GPA</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Your styles (reuse) -->
  <link rel="stylesheet" href="../css/styles.css" />

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="#">Admin Panel</a>
      <div class="d-flex align-items-center">
        <a href="admin_configure_indicators.html" class="btn btn-outline-primary btn-sm me-2">Configure Indicators</a>
        <button id="profileBtn" class="btn btn-outline-warning btn-sm me-2">Profile</button>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Manage Students</h4>
      <div>
        <input id="searchInput" class="form-control form-control-sm" placeholder="Search by name or roll" style="min-width:220px;" />
      </div>
    </div>
    <div id="alertWrapper"></div>
    <div class="card shadow-sm">
      <div class="card-body p-2">
        <div class="table-responsive">
          <table class="table table-sm mb-0" id="studentsTable" style="table-layout: fixed;">
            <colgroup>
              <col style="width:16%"/>
              <col style="width:26%"/>
              <col style="width:30%"/>
              <col style="width:18%"/>
              <col style="width:10%"/>
            </colgroup>
            <thead class="table-light">
              <tr>
                <th>Roll</th>
                <th>Name</th>
                <th>Email</th>
                <th>Attendance (%)</th>
                <th>Latest GPA</th>
              </tr>
            </thead>
            <tbody id="studentsTbody">
              <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Profile modal -->
  <div class="modal fade" id="adminProfileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title">Admin Profile</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="adminProfileForm">
            <div class="mb-2">
              <label class="form-label small">Name</label>
              <input id="adminName" class="form-control form-control-sm" />
            </div>
            <div class="mb-2">
              <label class="form-label small">Email</label>
              <input id="adminEmail" class="form-control form-control-sm" />
            </div>
            <div class="text-end">
              <button class="btn btn-primary btn-sm">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Admin JS -->
  <script src="../js/admin/manage_students.js"></script>
</body>
</html>
<script>
  // Safe page-level logout binder — works even if main.js is module-exported
  (function () {
    const btn = document.getElementById("logoutBtn");
    if (!btn) return;

    btn.addEventListener("click", function (ev) {
      // stop default form submit if button inside a form
      if (ev && typeof ev.preventDefault === "function") ev.preventDefault();

      // Prefer global logout if present (main.js may expose it as window.logout)
      if (typeof window.logout === "function") {
        try { return window.logout(); } catch (err) { /* fall through to fallback */ }
      }

      // Fallback: clear auth keys and redirect to login
      try {
        localStorage.removeItem("sp_token");
        localStorage.removeItem("sp_role");
        localStorage.removeItem("sp_user");
        localStorage.removeItem("sp_profileId");
      } catch (e) { /* ignore */ }

      // ensure redirect to login page path used in your project
      const loginURL = `${window.location.origin}/frontend/src/templates/login.html`;
      window.location.href = loginURL;
    });
  })();
</script>
