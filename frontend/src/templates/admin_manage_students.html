<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manage Students | Admin</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-light">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary">Admin • Manage Students</a>
      <div class="d-flex align-items-center">
        <a href="admin_dashboard.html" class="btn btn-outline-secondary btn-sm me-2">Back</a>
        <a href="admin_configure_indicators.html" class="btn btn-outline-primary btn-sm me-2">Configure Indicators</a>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="alertWrapper"></div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="mb-3">Students List</h5>

        <!-- Table -->
        <div class="table-responsive">
          <table class="table table-hover align-middle" id="studentsTable">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>Roll No</th>
                <th>Name</th>
                <th>Email</th>
                <th>Attendance (%)</th>
                <th>Predicted GPA</th>
              </tr>
            </thead>
            <tbody id="studentsBody">
              <tr><td colspan="7" class="text-center text-muted">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/admin/manage_students.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
